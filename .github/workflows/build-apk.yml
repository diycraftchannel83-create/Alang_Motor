name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files without overwriting app source
        run: |
          mkdir -p /tmp/alang_scaffold
          flutter create --platforms=android --project-name alang_motor --org com.alangmotor /tmp/alang_scaffold
          cp -R /tmp/alang_scaffold/android ./android

      - name: Generate launcher icons from SVG artwork
        run: |
          python -m pip install --user cairosvg
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(url="assets/alang_motor_icon.svg", write_to="assets/alang_motor_icon.png", output_width=1024, output_height=1024)
          PY

      - name: Resolve dependencies and generate Android launcher icons
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze

      - name: Test Excel formula parity
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alang-motor-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
